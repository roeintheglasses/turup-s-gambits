<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1208"/>
      <stop offset="100%" style="stop-color:#2d1f0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#FBC904"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>

  <!-- Border -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="none" stroke="url(#gold)" stroke-width="8"/>

  <!-- Card shape -->
  <rect x="156" y="96" width="200" height="280" rx="16" fill="#f5f0e1" stroke="url(#gold)" stroke-width="4"/>

  <!-- Spade symbol -->
  <path d="M256 140
           C256 140 200 200 200 240
           C200 270 220 290 256 290
           C292 290 312 270 312 240
           C312 200 256 140 256 140
           M256 290 L256 340
           M236 340 L276 340"
        fill="#1a1208" stroke="#1a1208" stroke-width="8" stroke-linecap="round"/>

  <!-- T letter for Turup -->
  <text x="256" y="440"
        font-family="serif"
        font-size="80"
        font-weight="bold"
        fill="url(#gold)"
        text-anchor="middle">T</text>
</svg>
