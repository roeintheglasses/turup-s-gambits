[build]
builder = "NIXPACKS"

[build.nixpacksPlan]
phases.install.cmds = ["pnpm install"]
phases.build.cmds = []

[deploy]
startCommand = "pnpm run server:prod"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "colyseus-game-server"
